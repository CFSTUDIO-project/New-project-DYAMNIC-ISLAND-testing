name: NOVA PILL - Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nova-pill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Validate project
      - name: Validate Android Project
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          chmod +x gradlew

      # 3. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      # IMPORTANT: packages overrides the obsolete
      # default "tools" installation.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Install SDK components
      - name: Install Android SDK Packages
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Gradle cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Verify environment
      - name: Verify Build Environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --version

      # 8. Unit tests
      - name: Run Unit Tests
        run: |
          ./gradlew --no-daemon testDebugUnitTest

      # 9. Lint
      - name: Run Android Lint
        run: |
          ./gradlew --no-daemon lintDebug

      # 10. Build APK
      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug

      # 11. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      # 12. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Diagnostics
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
