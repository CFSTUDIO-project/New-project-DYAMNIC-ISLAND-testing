name: NOVA PILL - Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nova-pill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Android Project
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          chmod +x gradlew

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Pinned Gradle
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version | grep -q "Gradle 8.13"

      - name: Run Unit Tests
        run: |
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        run: |
          ./gradlew --no-daemon lintDebug

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
