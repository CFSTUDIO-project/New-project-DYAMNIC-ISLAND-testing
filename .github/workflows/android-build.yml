name: NOVA PILL · Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-pill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts is missing"; exit 1; }
          test -f build.gradle.kts || { echo "::error::Root build.gradle.kts is missing"; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::Android app module is missing"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml is missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "::error::Gradle wrapper properties are missing"; exit 1; }
          test -x ./gradlew || chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build packages
        shell: bash
        run: |
          set -eu
          # sdkmanager may close stdin early after accepting all licenses; keep the
          # last command's exit code (sdkmanager), not `yes`' SIGPIPE status.
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          # The bootstrap wrapper in this source ZIP has no binary wrapper JAR.
          # The next step generates the official wrapper on the runner.
          validate-wrappers: false

      - name: Generate the standard Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::assembleDebug completed without producing a debug APK"
            exit 1
          fi
          printf 'APK: %s\n' "${apks[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PILL-diagnostics
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
